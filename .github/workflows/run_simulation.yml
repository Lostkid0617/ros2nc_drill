name: Run headless drill sim

on:
  workflow_dispatch:
  push:
    paths:
      - 'stp_sim/**'
      - 'stp_poc/**'
      - '.github/workflows/run_simulation.yml'

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.2.0
        with:
          ros-version: humble

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ros-humble-gazebo-ros-pkgs \
            ros-humble-ros2-control \
            ros-humble-ros2-controllers \
            gazebo11 \
            python3-colcon-common-extensions \
            python3-pip \
            xvfb \
            libgl1-mesa-glx \
            libglib2.0-0

      - name: Install Python deps (pip)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r stp_poc/requirements.txt || true

      - name: Source ROS2
        run: echo "source /opt/ros/humble/setup.bash" >> $GITHUB_ENV

      - name: Launch headless simulation
        env:
          DISPLAY: ":99"
        run: |
          source /opt/ros/humble/setup.bash
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          ros2 launch stp_sim/launch/sim_launch.py > sim_launch.log 2>&1 &
          SIM_PID=$!
          echo "Sim PID: $SIM_PID"
          sleep 10
          python3 stp_sim/scripts/send_demo_trajectory.py > demo.log 2>&1 || true
          # try to run feature_to_trajectory if features.json present in repo parsed
          if [ -f stp_poc/parsed/Q235-5.0-BAN6-N1/Q235-5.0-BAN6-N1.features.json ]; then
            python3 stp_sim/scripts/feature_to_trajectory.py stp_poc/parsed/Q235-5.0-BAN6-N1/Q235-5.0-BAN6-N1.features.json > feat_traj.log 2>&1 || true
          fi
          sleep 6
          ps aux | grep -E 'ros2|gzserver|gzclient' > processes.log || true
          kill $SIM_PID || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: |
            sim_launch.log
            demo.log
            feat_traj.log
            processes.log

      - name: List repo files
        run: ls -R
