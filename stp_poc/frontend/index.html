<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>STEP PoC Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    #app { display:flex; height: 100vh; }
    #viewer { flex: 1; background: #222; }
    #panel { width: 360px; padding: 12px; background: #f4f4f4; overflow:auto; }
    .feature { padding:8px; border:1px solid #ddd; margin-bottom:6px; }
    label{ display:block; font-size:12px; margin-top:6px; }
  </style>
</head>
<body>
<div id="app">
  <div id="viewer">
    <!-- Placeholder for 3D viewer. For PoC, we show mesh via three.js if available. -->
    <canvas id="glcanvas" style="width:100%;height:100%"></canvas>
  </div>
  <div id="panel">
    <h3>STEP PoC</h3>
    <input id="fileinput" type="file" accept=".step,.stp" />
    <div id="status"></div>
    <h4>Detected Features</h4>
    <div id="features"></div>
    <button id="gen">Generate Trajectory</button>
    <pre id="trajout"></pre>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const fileInput = document.getElementById('fileinput');
const status = document.getElementById('status');
const featuresDiv = document.getElementById('features');
const trajOut = document.getElementById('trajout');
let currentToken = null;
let meta = null;

fileInput.addEventListener('change', async (ev) => {
  const f = ev.target.files[0];
  if(!f) return;
  status.innerText = 'Uploading...';
  const fd = new FormData();
  fd.append('file', f);
  const res = await fetch('/upload', { method: 'POST', body: fd });
  if(!res.ok){ status.innerText = 'Upload failed: '+res.status; return; }
  const data = await res.json();
  currentToken = data.token;
  meta = data.meta;
  status.innerText = 'Uploaded. Token: '+currentToken;
  loadFeaturesAndMesh(data);
});

async function loadFeaturesAndMesh(data){
  featuresDiv.innerHTML = '';
  meta = data.meta;
  const feats = meta.features || [];
  feats.forEach(f => {
    const el = document.createElement('div'); el.className='feature';
    el.innerHTML = `<b>${f.id}</b> (${f.type})<br/>radius:${f.radius} depth:${f.depth || 'NA'}`;
    el.dataset.id = f.id;

    const depthLabel = document.createElement('label');
    depthLabel.innerText = 'Depth (mm)';
    const depthInput = document.createElement('input'); depthInput.type='number'; depthInput.value = f.depth || 5;
    depthInput.style.width='100%';
    el.appendChild(depthLabel); el.appendChild(depthInput);

    const feedLabel = document.createElement('label'); feedLabel.innerText='Feed (mm/min)';
    const feedInput = document.createElement('input'); feedInput.type='number'; feedInput.value=200; feedInput.style.width='100%';
    el.appendChild(feedLabel); el.appendChild(feedInput);

    featuresDiv.appendChild(el);
  });
  // load mesh
  if(data.mesh_url){
    const meshUrl = data.mesh_url;
    // three.js viewer load
    initThreeJsViewer(meshUrl.replace('/static','/static'));
  }
}

function initThreeJsViewer(meshUrl){
  // minimal three.js scene loading GLB
  const canvas = document.getElementById('glcanvas');
  const renderer = new THREE.WebGLRenderer({canvas});
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);
  const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth/canvas.clientHeight, 0.1, 1000);
  camera.position.set(200,200,200);
  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
  scene.add(light);
  const loader = new THREE.GLTFLoader();
  loader.load(meshUrl, gltf => {
    scene.add(gltf.scene);
    animate();
  }, undefined, err=>{ console.error(err); status.innerText='Failed to load mesh'; });

  function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
}

document.getElementById('gen').addEventListener('click', async ()=>{
  if(!currentToken) return alert('No file uploaded');
  const boxes = document.querySelectorAll('.feature');
  const selections = [];
  boxes.forEach(b=>{
    const id = b.dataset.id;
    const inputs = b.querySelectorAll('input');
    const depth = parseFloat(inputs[0].value);
    const feed = parseFloat(inputs[1].value);
    selections.push({ feature_id: id, depth: depth, feed: feed, retract: 2.0 });
  });
  const res = await fetch('/generate_trajectory', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ file_token: currentToken, selections }) });
  const data = await res.json();
  trajOut.innerText = JSON.stringify(data, null, 2);
});
</script>
</body>
</html>
