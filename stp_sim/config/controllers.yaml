# Controller configuration for ros2_control (joint_trajectory_controller demo)
controller_manager:
  ros__parameters:
    update_rate: 100

joint_state_broadcaster:
  ros__parameters:
    use_native: false

joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - x_axis_joint
      - y_axis_joint
      - z_axis_joint
      - a_axis_joint
    state_publish_rate: 50
    action_monitor_rate: 20
    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.01
      joints:
        x_axis_joint:
          trajectory: 0.2
          goal: 0.02
        y_axis_joint:
          trajectory: 0.2
          goal: 0.02
        z_axis_joint:
          trajectory: 0.1
          goal: 0.01
        a_axis_joint:
          trajectory: 0.5
          goal: 0.05
